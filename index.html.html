<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uplift Seoul — Stocktake</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root { color-scheme: light;
  --bg:#f7f6f3; --card:#ffffff; --ink:#1c1b18; --muted:#75716a; --line:#e6e3dc;
  --accent:#b3541e; --accent-soft:#fdf0e7; --green:#2e7d4f; --green-soft:#e8f5ee;
  --red:#b3402e; --red-soft:#fdeeea; --amber:#9a7b0a; --amber-soft:#fdf6dd;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
header { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; }
.hrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
h1 { font-size:17px; margin:0; letter-spacing:.2px; }
h1 small { color:var(--muted); font-weight:400; }
.spacer { flex:1; }
select, input[type=date] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
button { font:inherit; padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
button:hover { border-color:#c9c4ba; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary:hover { filter:brightness(1.07); }
button.small { padding:4px 9px; font-size:13px; }
.tabs { display:flex; gap:4px; margin-top:10px; }
.tab { padding:7px 14px; border-radius:8px 8px 0 0; border:1px solid transparent; background:none; color:var(--muted); font-weight:600; }
.tab.active { background:var(--bg); border:1px solid var(--line); border-bottom-color:var(--bg); color:var(--ink); }
main { padding:14px 16px 60px; max-width:1060px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
.catH { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:18px 0 6px; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
.num { text-align:right; white-space:nowrap; }
.chip { display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px; background:var(--bg); border:1px solid var(--line); color:var(--muted); }
.qty { display:inline-flex; align-items:center; gap:0; }
.qty button { width:34px; height:34px; padding:0; font-size:18px; line-height:1; border-radius:8px 0 0 8px; }
.qty button:last-child { border-radius:0 8px 8px 0; }
.qty input { width:58px; height:34px; text-align:center; border:1px solid var(--line); border-left:none; border-right:none; font:inherit; }
.qty input:focus { outline:2px solid var(--accent-soft); }
.qty input.empty { background:var(--amber-soft); }
.low { color:var(--red); font-weight:700; }
.ok { color:var(--green); }
.badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; }
.badge.order { background:var(--red-soft); color:var(--red); }
.badge.fine { background:var(--green-soft); color:var(--green); }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.toolbar input[type=search] { flex:1; min-width:160px; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
.muted { color:var(--muted); font-size:13px; }
.supH { display:flex; align-items:center; gap:10px; margin:0 0 4px; font-size:15px; }
.total { font-weight:700; }
.grand { font-size:17px; font-weight:700; text-align:right; padding:10px 4px 0; }
.sugg { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); }
.sugg:last-child { border-bottom:none; }
.sugg .icon { font-size:16px; }
.toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:50; max-width:90%; }
.toast.show { opacity:1; }
dialog { border:1px solid var(--line); border-radius:14px; padding:18px; max-width:480px; width:92%; }
dialog::backdrop { background:rgba(0,0,0,.35); }
.frm { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.frm label { font-size:12px; color:var(--muted); display:block; margin-bottom:3px; }
.frm input, .frm select { width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:8px; }
.frm .full { grid-column:1/-1; }
.editIn { width:70px; font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:6px; text-align:right; }
.editIn.wide { width:110px; text-align:left; }
.statbar { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:12px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 16px; }
.stat .v { font-size:20px; font-weight:700; }
.stat .l { font-size:12px; color:var(--muted); }
.sync-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--amber); margin-right:5px; vertical-align:middle; }
.sync-dot.live { background:var(--green); }
.sync-dot.err { background:var(--red); }
@media (max-width:640px){ .hideM { display:none; } main{padding:10px 8px 60px;} td,th{padding:6px 5px;} }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Uplift Seoul <small>· Stocktake</small></h1>
    <div class="spacer"></div>
    <select id="weekSel" title="Stocktake week"></select>
    <button class="small" id="newWeekBtn">+ New week</button>
    <button class="small" id="exportBtn">⬇ Export</button>
    <button class="small" id="importBtn">⬆ Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
  <div class="muted" id="syncInfo" style="margin-top:4px;"><span class="sync-dot" id="syncDot"></span><span id="syncText">Connecting…</span></div>
  <div class="tabs">
    <button class="tab active" data-tab="count">Stocktake</button>
    <button class="tab" data-tab="order">Order</button>
    <button class="tab" data-tab="items">Items</button>
    <button class="tab" data-tab="insights">Suggestions</button>
  </div>
</header>
<main id="mainContent" style="display:none">
  <section id="tab-count"></section>
  <section id="tab-order" hidden></section>
  <section id="tab-items" hidden></section>
  <section id="tab-insights" hidden></section>
</main>
<div id="loadingMsg" style="padding:40px;text-align:center;color:var(--muted);">Loading…</div>
<div class="toast" id="toast"></div>

<dialog id="itemDlg">
  <h3 style="margin:0;" id="dlgTitle">Add item</h3>
  <div class="frm">
    <div class="full"><label>Name</label><input id="f_name" placeholder="e.g. Campari (700ml)"></div>
    <div class="full"><label>Korean name (한글)</label><input id="f_ko" placeholder="예: 캄파리 (700ml)"></div>
    <div><label>Category</label><select id="f_cat"></select></div>
    <div><label>Supplier</label><input id="f_sup" list="supList"><datalist id="supList"></datalist></div>
    <div><label>Cost / order unit (₩)</label><input id="f_cost" type="number" min="0" step="1"></div>
    <div><label>Min stock</label><input id="f_min" type="number" min="0" step="0.5"></div>
    <div><label>Min order qty (case size)</label><input id="f_moq" type="number" min="1" step="1" value="1"></div>
    <div><label>Notes</label><input id="f_notes"></div>
  </div>
  <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">
    <button onclick="itemDlg.close()">Cancel</button>
    <button class="primary" id="f_save">Save</button>
  </div>
</dialog>

<dialog id="newWeekDlg">
  <h3 style="margin:0 0 8px;">New stocktake week</h3>
  <div class="muted" style="margin-bottom:10px;">Pick the date for the new week:</div>
  <input type="date" id="nwDate" style="font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;width:100%;">
  <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">
    <button onclick="newWeekDlg.close()">Cancel</button>
    <button class="primary" id="nwConfirm">Start week</button>
  </div>
</dialog>

// ── State ─────────────────────────────────────────────────
let state = null;
let _saveTimer = null;
let _ignoreNextSnapshot = false;

function seedState(){
  const weekKeys = ['2026-05-17','2026-05-24','2026-05-31','2026-06-07'];
  const counts = {}; weekKeys.forEach(k=>counts[k]={});
  const items = SEED.items.map((it,i)=>{
    const id = 'i'+(i+1);
    (it.history||[]).slice(0,4).forEach((v,wi)=>{ if(v!==null && v!==undefined) counts[weekKeys[wi]][id]=v; });
    return { id, name:it.name, nameKo:it.nameKo||'', category:it.category, supplier:it.supplier||'',
             cost:it.cost||0, minStock:it.minStock||0, minOrderQty:it.minOrderQty||1,
             notes:it.notes||'', archived:false };
  });
  return { items, counts, currentWeek: weekKeys[weekKeys.length-1], nextId: items.length+1 };
}

function save(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    _ignoreNextSnapshot = true;
    docRef.set(state)
      .then(()=>setSyncStatus('live','Synced'))
      .catch(e=>{ setSyncStatus('err','Save failed'); console.error(e); });
  }, 400);
}

// ── Sync status ───────────────────────────────────────────
function setSyncStatus(type, msg){
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot' + (type==='live'?' live':type==='err'?' err':'');
  txt.textContent = msg;
}

// ── Firestore listener ────────────────────────────────────
function initData(){
  setSyncStatus('','Connecting…');
  docRef.onSnapshot(doc=>{
    if(_ignoreNextSnapshot){ _ignoreNextSnapshot=false; return; }
    if(doc.exists){
      state = doc.data();
      setSyncStatus('live','Live');
    } else {
      state = seedState();
      docRef.set(state);
      setSyncStatus('live','Initialised');
    }
    document.getElementById('loadingMsg').style.display='none';
    document.getElementById('mainContent').style.display='';
    renderAll();
  }, err=>{
    setSyncStatus('err','Connection error');
    console.error('Firestore error:', err);
    if(!state){ state=seedState(); }
    document.getElementById('loadingMsg').textContent='Offline — changes won\'t be saved.';
    document.getElementById('mainContent').style.display='';
    renderAll();
  });
}

// ── Helpers ───────────────────────────────────────────────
const W = '₩';
const fmtW = n => W + Math.round(n).toLocaleString('en-US');
const unitCost = it => it.cost / Math.max(1, it.minOrderQty||1);
const weeks = () => Object.keys(state.counts).sort();
const activeItems = () => state.items.filter(i=>!i.archived);
function countOf(id,wk){ const v=state.counts[wk]?state.counts[wk][id]:undefined; return(v===undefined||v===null)?null:v; }
function latestCount(id,uptoWk){
  const ws=weeks().filter(w=>w<=uptoWk).reverse();
  for(const w of ws){ const v=countOf(id,w); if(v!==null) return{v,w}; }
  return null;
}
function avgUse(id){
  const ws=weeks(); const drops=[]; let prev=null;
  for(const w of ws){ const v=countOf(id,w); if(v===null) continue;
    if(prev!==null && prev>=v) drops.push(prev-v); prev=v; }
  if(!drops.length) return null;
  return drops.reduce((a,b)=>a+b,0)/drops.length;
}
function suggestion(it){
  const lc=latestCount(it.id,state.currentWeek); const cur=lc?lc.v:0;
  const use=avgUse(it.id);
  const target=Math.max(it.minStock,use===null?0:Math.ceil(use));
  let need=target-cur;
  if(need<=0) return{qty:0,cur,use,target,stale:lc?lc.w!==state.currentWeek:true};
  const moq=Math.max(1,it.minOrderQty||1);
  need=Math.ceil(need/moq)*moq;
  return{qty:need,cur,use,target,stale:lc?lc.w!==state.currentWeek:true};
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── Export / Import ───────────────────────────────────────
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download='uplift-stocktake-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Exported ✓');
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const obj=JSON.parse(ev.target.result);
      if(!obj.items||!obj.counts) throw new Error('Not a valid backup');
      if(!confirm('Replace ALL current data with this backup?')){ e.target.value=''; return; }
      state=obj; save(); renderAll(); toast('Imported ✓');
    }catch(err){ toast('Import failed: '+err.message); }
    e.target.value='';
  };
  reader.readAsText(file);
};

// ── Stocktake tab ─────────────────────────────────────────
let countFilter='';
function renderCount(){
  const el=document.getElementById('tab-count'); const wk=state.currentWeek;
  const its=activeItems().filter(i=>!countFilter||(i.name+' '+i.category+' '+i.supplier).toLowerCase().includes(countFilter));
  const counted=activeItems().filter(i=>countOf(i.id,wk)!==null).length;
  const cats=[...new Set(its.map(i=>i.category))];
  let html=`<div class="toolbar"><input type="search" id="cSearch" placeholder="Search items…" value="${esc(countFilter)}"><span class="muted">${counted}/${activeItems().length} counted</span></div>`;
  for(const c of cats){
    html+=`<div class="catH">${esc(c)}</div><div class="card"><table>`;
    for(const it of its.filter(i=>i.category===c)){
      const v=countOf(it.id,wk);
      const last=latestCount(it.id,weeks().filter(w=>w<wk).pop()||'');
      const lowNow=v!==null&&v<it.minStock;
      html+=`<tr>
        <td><div>${esc(it.name)}</div><div class="muted hideM" style="font-size:12px">${esc(it.supplier||'—')} · min ${it.minStock}</div></td>
        <td class="num hideM muted">last: ${last?last.v:'—'}</td>
        <td class="num">${lowNow?'<span class="badge order">LOW</span>':(v!==null?'<span class="badge fine">OK</span>':'')}</td>
        <td class="num"><span class="qty">
          <button onclick="bump('${it.id}',-0.5)">−</button>
          <input type="number" inputmode="decimal" min="0" step="0.5" class="${v===null?'empty':''}" value="${v===null?'':v}" onchange="setCount('${it.id}',this.value)">
          <button onclick="bump('${it.id}',0.5)">+</button>
        </span></td></tr>`;
    }
    html+=`</table></div>`;
  }
  el.innerHTML=html;
  const s=document.getElementById('cSearch');
  s.oninput=e=>{ countFilter=e.target.value.toLowerCase(); const pos=s.selectionStart; renderCount(); const ns=document.getElementById('cSearch'); ns.focus(); ns.setSelectionRange(pos,pos); };
}
function setCount(id,val){
  const wk=state.currentWeek;
  if(val===''||val===null){ delete state.counts[wk][id]; }
  else{ const n=Math.max(0,parseFloat(val)); if(isNaN(n)) return; state.counts[wk][id]=n; }
  save(); setSyncStatus('','Saving…');
}
function bump(id,d){
  const wk=state.currentWeek; const cur=countOf(id,wk);
  state.counts[wk][id]=Math.max(0,(cur===null?0:cur)+d);
  save(); setSyncStatus('','Saving…'); renderCount();
}

// ── Order tab ─────────────────────────────────────────────
let showAllOrder=false; let orderOverride={};
function renderOrder(){
  const el=document.getElementById('tab-order');
  const rows=activeItems().map(it=>({it,s:suggestion(it)}));
  const visible=rows.filter(r=>showAllOrder||r.s.qty>0||(orderOverride[r.it.id]||0)>0);
  const sups=[...new Set(visible.map(r=>r.it.supplier||'(no supplier)'))].sort();
  const qtyOf=r=>orderOverride[r.it.id]!==undefined?orderOverride[r.it.id]:r.s.qty;
  let grand=0;
  let html=`<div class="toolbar"><span class="muted">Order for week of <b>${state.currentWeek}</b>. Suggested = top up to max(min stock, avg weekly use), rounded to case size.</span><div class="spacer"></div><label class="muted"><input type="checkbox" ${showAllOrder?'checked':''} onchange="showAllOrder=this.checked;renderOrder()"> show all</label></div>`;
  if(!visible.length) html+=`<div class="card">Nothing to order — all stocked to target. 🎉</div>`;
  for(const sup of sups){
    const rs=visible.filter(r=>(r.it.supplier||'(no supplier)')===sup);
    let sub=0; let body='';
    for(const r of rs){
      const q=qtyOf(r); const moq=Math.max(1,r.it.minOrderQty||1); const line=(q/moq)*r.it.cost; sub+=line;
      const cases=q/moq;
      body+=`<tr>
        <td>${esc(r.it.name)}${r.s.stale?' <span class="chip">stale</span>':''}</td>
        <td class="num">${r.s.cur}</td><td class="num hideM">${r.it.minStock}</td>
        <td class="num hideM">${r.s.use===null?'—':r.s.use.toFixed(1)}</td>
        <td class="num"><input class="editIn" type="number" min="0" step="${moq}" value="${q}" onchange="orderOverride['${r.it.id}']=Math.max(0,parseFloat(this.value)||0);renderOrder()">${moq>1?`<div class="muted" style="font-size:11px">${cases%1?cases.toFixed(1):cases} case${cases>1?'s':''} of ${moq}</div>`:''}</td>
        <td class="num hideM">${r.it.cost?fmtW(r.it.cost)+(moq>1?'<span class="muted">/case</span>':''):'—'}</td>
        <td class="num total">${line?fmtW(line):'—'}</td></tr>`;
    }
    grand+=sub;
    html+=`<div class="card"><div class="supH"><b>${esc(sup)}</b><span class="chip">${rs.length} item${rs.length>1?'s':''}</span><div class="spacer"></div><span class="total">${fmtW(sub)}</span>
      <button class="small" onclick="copyOrder('${esc(sup)}','en')">Copy EN</button>
      <button class="small" onclick="copyOrder('${esc(sup)}','ko')">Copy 한글</button></div>
      <table><tr><th>Item</th><th class="num">Stock</th><th class="num hideM">Min</th><th class="num hideM">Avg/wk</th><th class="num">Order</th><th class="num hideM">Price ₩</th><th class="num">Total</th></tr>${body}</table></div>`;
  }
  if(visible.length) html+=`<div class="grand">Grand total: ${fmtW(grand)}</div>`;
  el.innerHTML=html;
}
function copyOrder(sup,lang){
  const ko=lang==='ko';
  const rows=activeItems().map(it=>({it,s:suggestion(it)}))
    .filter(r=>(r.it.supplier||'(no supplier)')===sup)
    .map(r=>({r,q:orderOverride[r.it.id]!==undefined?orderOverride[r.it.id]:r.s.qty}))
    .filter(x=>x.q>0);
  const header=ko?`업리프트 서울 발주서 — ${sup} — ${state.currentWeek}`:`Uplift Seoul order — ${sup} — week of ${state.currentWeek}`;
  const txt=header+'\n'+rows.map(x=>{
    const moq=Math.max(1,x.r.it.minOrderQty||1); const cases=x.q/moq; const cs=cases%1?cases.toFixed(1):cases;
    const nm=ko?(x.r.it.nameKo||x.r.it.name):x.r.it.name;
    const ct=moq>1?(ko?` (${cs}박스)`:` (${cs} case${cases>1?'s':''})`):'';
    return `• ${nm} × ${x.q}`+ct;
  }).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(ko?sup+' 주문 복사 완료':'Order copied for '+sup));
  } else {
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast(ko?sup+' 주문 복사 완료':'Order copied for '+sup);
  }
}

function renderItems(){
  const el=document.getElementById('tab-items');
  const its=activeItems().filter(i=>!itemFilter||(i.name+' '+i.category+' '+i.supplier).toLowerCase().includes(itemFilter));
  let html=`<div class="toolbar"><input type="search" id="iSearch" placeholder="Search items…" value="${esc(itemFilter)}"><button class="primary" onclick="openItemDlg(null)">+ Add item</button></div>
  <div class="card"><table><tr><th>Item</th><th class="hideM">Category</th><th class="hideM">Supplier</th><th class="num">Price ₩</th><th class="num">Min</th><th class="num hideM">Case</th><th></th></tr>`;
  for(const it of its){
    html+=`<tr>
      <td>${esc(it.name)}${it.nameKo?`<div class="muted" style="font-size:12px">${esc(it.nameKo)}</div>`:''}${it.notes?`<div class="muted" style="font-size:12px">${esc(it.notes)}</div>`:''}</td>
      <td class="hideM"><span class="chip">${esc(it.category)}</span></td>
      <td class="hideM muted">${esc(it.supplier||'—')}</td>
      <td class="num"><input class="editIn" type="number" min="0" value="${it.cost}" onchange="updField('${it.id}','cost',this.value)"></td>
      <td class="num"><input class="editIn" type="number" min="0" step="0.5" value="${it.minStock}" onchange="updField('${it.id}','minStock',this.value)"></td>
      <td class="num hideM"><input class="editIn" type="number" min="1" value="${it.minOrderQty}" onchange="updField('${it.id}','minOrderQty',this.value)"></td>
      <td class="num"><button class="small" onclick="openItemDlg('${it.id}')">Edit</button> <button class="small" onclick="archiveItem('${it.id}')">✕</button></td></tr>`;
  }
  html+=`</table></div>`;
  el.innerHTML=html;
  const s=document.getElementById('iSearch');
  s.oninput=e=>{ itemFilter=e.target.value.toLowerCase(); const p=s.selectionStart; renderItems(); const ns=document.getElementById('iSearch'); ns.focus(); ns.setSelectionRange(p,p); };
}
function updField(id,f,v){ const it=state.items.find(i=>i.id===id); it[f]=Math.max(0,parseFloat(v)||0); save(); toast('Saved'); }
function archiveItem(id){ const it=state.items.find(i=>i.id===id); if(confirm('Remove "'+it.name+'" from the lists? History kept.')){ it.archived=true; save(); renderAll(); } }
function openItemDlg(id){
  editingId=id;
  const cats=[...new Set(state.items.map(i=>i.category))];
  document.getElementById('f_cat').innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('')+'<option value="__new__">+ New category…</option>';
  document.getElementById('supList').innerHTML=[...new Set(state.items.map(i=>i.supplier).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('');
  const it=id?state.items.find(i=>i.id===id):null;
  document.getElementById('dlgTitle').textContent=it?'Edit item':'Add item';
  f_name.value=it?it.name:''; f_ko.value=it?(it.nameKo||''):''; f_sup.value=it?it.supplier:''; f_cost.value=it?it.cost:'';
  f_min.value=it?it.minStock:1; f_moq.value=it?it.minOrderQty:1; f_notes.value=it?it.notes:'';
  if(it) f_cat.value=it.category;
  itemDlg.showModal();
}
document.getElementById('f_save').onclick=()=>{
  let cat=f_cat.value;
  if(cat==='__new__'){ cat=prompt('New category name:'); if(!cat) return; }
  if(!f_name.value.trim()) return toast('Name required');
  const data={name:f_name.value.trim(),nameKo:f_ko.value.trim(),category:cat,supplier:f_sup.value.trim(),
    cost:parseFloat(f_cost.value)||0,minStock:parseFloat(f_min.value)||0,
    minOrderQty:Math.max(1,parseFloat(f_moq.value)||1),notes:f_notes.value.trim()};
  if(editingId){ Object.assign(state.items.find(i=>i.id===editingId),data); }
  else{ state.items.push({id:'i'+(state.nextId++),archived:false,...data}); }
  save(); itemDlg.close(); renderAll(); toast(editingId?'Item updated':'Item added');
};

// ── Insights tab ──────────────────────────────────────────
function renderInsights(){
  const el=document.getElementById('tab-insights'); const wkCount=weeks().length; const suggs=[];
  for(const it of activeItems()){
    const use=avgUse(it.id); if(use===null) continue; const u=Math.ceil(use);
    if(use>0&&u>it.minStock) suggs.push({it,icon:'📈',txt:`Avg use is <b>${use.toFixed(1)}/wk</b> but min stock is only <b>${it.minStock}</b> — you risk running out.`,newMin:u});
    else if(use===0&&it.minStock>2&&wkCount>=3) suggs.push({it,icon:'📉',txt:`No recorded use across ${wkCount} weeks, but min stock is <b>${it.minStock}</b>.`,newMin:Math.max(1,Math.floor(it.minStock/2))});
  }
  const totalValue=activeItems().reduce((a,it)=>{ const lc=latestCount(it.id,state.currentWeek); return a+(lc?lc.v:0)*unitCost(it); },0);
  const weeklySpend=activeItems().reduce((a,it)=>{ const u=avgUse(it.id); return a+(u||0)*unitCost(it); },0);
  let html=`<div class="statbar">
    <div class="stat"><div class="v">${fmtW(totalValue)}</div><div class="l">stock on hand</div></div>
    <div class="stat"><div class="v">${fmtW(weeklySpend)}</div><div class="l">est. usage cost / week</div></div>
    <div class="stat"><div class="v">${suggs.length}</div><div class="l">suggested min changes</div></div>
  </div><div class="card">`;
  if(!suggs.length) html+=`<div class="muted">No suggestions yet — they appear once a few weeks of counts are in.</div>`;
  for(const s of suggs){
    html+=`<div class="sugg"><span class="icon">${s.icon}</span>
      <div style="flex:1"><b>${esc(s.it.name)}</b><div class="muted">${s.txt}</div></div>
      <button class="small" onclick="applyMin('${s.it.id}',${s.newMin})">Set min to ${s.newMin}</button></div>`;
  }
  html+=`</div><div class="muted" style="margin-top:10px;">Usage is estimated from week-to-week drops in counts. The more weeks counted, the better these get.</div>`;
  el.innerHTML=html;
}
function applyMin(id,v){ state.items.find(i=>i.id===id).minStock=v; save(); renderInsights(); toast('Min stock updated'); }

// ── Render all ────────────────────────────────────────────
function renderAll(){ renderWeekSel(); renderCount(); renderOrder(); renderItems(); renderInsights(); }

// ── Boot ──────────────────────────────────────────────────
initData();
</script>
</body>
